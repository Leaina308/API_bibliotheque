openapi: 3.0.3
info:
  title: API Bibliothèque
  version: 1.0.0
  description: API REST de gestion d'une bibliothèque (auteurs, livres, emprunts) avec authentification JWT.
servers:
  - url: http://localhost:8000/api/v1
tags:
  - name: Auth
  - name: Authors
  - name: Books
  - name: Borrows
  - name: Subscriptions
  - name: Webhooks

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Se connecter et obtenir un token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AuthPayload' }
        '401':
          description: Identifiants invalides
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /authors:
    get:
      tags: [Authors]
      summary: Lister les auteurs
      responses:
        '200':
          description: Liste des auteurs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Author' }
    post:
      tags: [Authors]
      summary: Créer un auteur
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorInput' }
      responses:
        '201':
          description: Auteur créé
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Author' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /authors/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Authors]
      summary: Détails d'un auteur avec ses livres
      responses:
        '200':
          description: Détails de l'auteur
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AuthorWithBooks' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Authors]
      summary: Modifier un auteur
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorInput' }
      responses:
        '200':
          description: Auteur modifié
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Author' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Authors]
      summary: Supprimer un auteur
      security: [{ BearerAuth: [] }]
      responses:
        '204': { description: Auteur supprimé }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /books:
    get:
      tags: [Books]
      summary: Lister les livres
      parameters:
        - name: available
          in: query
          description: Filtrer par disponibilité
          schema: { type: boolean }
      responses:
        '200':
          description: Liste des livres
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Book' }
    post:
      tags: [Books]
      summary: Créer un livre
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookInput' }
      responses:
        '201':
          description: Livre créé
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Book' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /books/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Books]
      summary: Détails d'un livre
      responses:
        '200':
          description: Détails du livre
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Book' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Books]
      summary: Modifier un livre
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookInput' }
      responses:
        '200':
          description: Livre modifié
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Book' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Books]
      summary: Supprimer un livre
      security: [{ BearerAuth: [] }]
      responses:
        '204': { description: Livre supprimé }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /borrows:
    get:
      tags: [Borrows]
      summary: Lister les emprunts en cours
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Emprunts en cours (returned_at nul)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Borrow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Borrows]
      summary: Emprunter un livre
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BorrowInput' }
      responses:
        '201':
          description: Emprunt créé, le livre devient indisponible
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Borrow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Abonnement gratuit, limite de 2 emprunts actifs atteinte
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Données invalides ou livre indisponible
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /borrows/{id}/return:
    patch:
      tags: [Borrows]
      summary: Rendre un livre
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Livre rendu, il redevient disponible
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Borrow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Livre déjà rendu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /books/{id}/summary:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Books]
      summary: Générer (et sauvegarder) le résumé d'un livre via l'IA
      description: Si le livre a déjà un résumé, il est renvoyé sans nouvel appel à l'IA.
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Résumé généré ou résumé existant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SummaryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    get:
      tags: [Books]
      summary: Lire le résumé existant d'un livre
      responses:
        '200':
          description: Résumé du livre
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SummaryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /books/smart-search:
    post:
      tags: [Books]
      summary: Recherche par description en langage naturel
      description: L'IA extrait des mots-clés, puis la recherche est faite en base (titre, résumé, auteur).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SmartSearchInput' }
      responses:
        '200':
          description: Mots-clés extraits et livres correspondants
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmartSearchResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /subscriptions/payment-intent:
    post:
      tags: [Subscriptions]
      summary: Créer un PaymentIntent Stripe (abonnement premium, 5 €)
      description: Mode test Stripe. Les métadonnées user_id et plan identifient l'utilisateur dans le webhook.
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: PaymentIntent créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /subscriptions/status:
    get:
      tags: [Subscriptions]
      summary: Statut d'abonnement de l'utilisateur connecté
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Statut d'abonnement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionStatusResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /webhooks/stripe:
    post:
      tags: [Webhooks]
      summary: Réception des événements Stripe
      description: >
        Pas de JWT : l'authenticité est vérifiée par la signature HMAC-SHA256
        (en-tête Stripe-Signature). payment_intent.succeeded passe l'utilisateur en premium.
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: { type: string, example: 't=1700000000,v1=5257a869e7ec...' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StripeEvent' }
      responses:
        '200':
          description: Événement reçu
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean, example: true }
        '401':
          description: Signature absente ou invalide
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer, example: 1 }

  responses:
    Unauthorized:
      description: Token manquant, invalide ou expiré
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, message: Token manquant }
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, message: Ressource introuvable }
    ServiceUnavailable:
      description: Service externe (IA ou Stripe) indisponible ou non configuré
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, message: 'Service IA indisponible (HTTP 500)' }
    ValidationError:
      description: Validation échouée
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            message: Validation échouée
            errors: { title: ['Le titre est requis.'] }

  schemas:
    SuccessBase:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: OK }
    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: admin@biblio.com }
        password: { type: string, example: password123 }
    AuthPayload:
      type: object
      properties:
        token: { type: string, example: eyJhbGciOiJIUzI1NiIs... }
        user:
          type: object
          properties:
            id: { type: integer, example: 1 }
            name: { type: string, example: Admin }
            email: { type: string, example: admin@biblio.com }
    Author:
      type: object
      properties:
        id: { type: integer, example: 1 }
        first_name: { type: string, example: Victor }
        last_name: { type: string, example: Hugo }
        nationality: { type: string, nullable: true, example: Française }
    AuthorWithBooks:
      allOf:
        - $ref: '#/components/schemas/Author'
        - type: object
          properties:
            books:
              type: array
              items: { $ref: '#/components/schemas/BookSummary' }
    AuthorInput:
      type: object
      required: [first_name, last_name]
      properties:
        first_name: { type: string }
        last_name: { type: string }
        nationality: { type: string }
    BookSummary:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        isbn: { type: string }
        year: { type: integer }
        available: { type: boolean }
    Book:
      type: object
      properties:
        id: { type: integer, example: 1 }
        title: { type: string, example: Les Misérables }
        isbn: { type: string, example: '9782070409228' }
        year: { type: integer, example: 1862 }
        available: { type: boolean, example: true }
        author:
          type: object
          properties:
            id: { type: integer }
            first_name: { type: string }
            last_name: { type: string }
    BookInput:
      type: object
      required: [title, isbn, year, author_id]
      properties:
        title: { type: string }
        isbn: { type: string }
        year: { type: integer }
        author_id: { type: integer }
    Borrow:
      type: object
      properties:
        id: { type: integer, example: 3 }
        user_name: { type: string, example: Jean Rakoto }
        book_id: { type: integer, example: 2 }
        borrowed_at: { type: string, example: '2026-11-18 11:00:00' }
        returned_at: { type: string, nullable: true, example: null }
        payment_status: { type: string, enum: [pending, paid, free], example: free }
    BorrowInput:
      type: object
      required: [user_name, book_id]
      properties:
        user_name: { type: string, example: Jean Rakoto }
        book_id: { type: integer, example: 2 }
    SummaryResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Résumé généré }
        data:
          type: object
          properties:
            book_id: { type: integer, example: 1 }
            title: { type: string, example: Clean Code }
            summary: { type: string, example: 'Clean Code est un guide pratique pour écrire du code lisible...' }
            generated_by: { type: string, example: gpt-4o-mini }
            generated_at: { type: string, format: date-time, example: '2026-11-25T08:15:00Z' }
    SmartSearchInput:
      type: object
      required: [query]
      properties:
        query: { type: string, example: un livre sur les bonnes pratiques de programmation en Java }
    SmartSearchResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        query: { type: string }
        keywords: { type: array, items: { type: string }, example: [programmation, Java, bonnes pratiques] }
        data: { type: array, items: { $ref: '#/components/schemas/Book' } }
    PaymentIntentResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: OK }
        data:
          type: object
          properties:
            client_secret: { type: string, example: pi_3Px..._secret_... }
            amount: { type: integer, example: 500, description: Montant en centimes }
            currency: { type: string, example: eur }
            publishable_key: { type: string, example: pk_test_... }
    SubscriptionStatusResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data:
          type: object
          properties:
            user_id: { type: integer, example: 1 }
            subscription_status: { type: string, enum: [free, premium] }
            borrow_limit: { type: integer, nullable: true, example: 2, description: null = illimité }
    StripeEvent:
      type: object
      properties:
        type: { type: string, example: payment_intent.succeeded }
        data:
          type: object
          properties:
            object:
              type: object
              properties:
                id: { type: string, example: pi_3Px... }
                amount: { type: integer, example: 500 }
                metadata:
                  type: object
                  properties:
                    user_id: { type: string, example: '1' }
                    plan: { type: string, example: premium }
